name: Deploy Yandex Cloud

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

concurrency:
  group: deploy-yc-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22.12.0"
  BACKEND_IMAGE: updatingspace-id-backend

jobs:
  generate-build-id:
    name: Generate BUILD_ID
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.build_id.outputs.BUILD_ID }}
    steps:
      - name: Generate BUILD_ID
        id: build_id
        run: |
          BUILD_DATE=$(date -u +%Y.%m.%d)
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_ID="${BUILD_DATE}-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          echo "BUILD_ID=${BUILD_ID}" >> "$GITHUB_OUTPUT"

  validate-deploy-secrets:
    name: Validate deploy secrets
    runs-on: ubuntu-latest
    env:
      YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
      YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
      YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
      YC_CONTAINER_REGISTRY_ID: ${{ secrets.YC_CONTAINER_REGISTRY_ID }}
      YC_TF_BACKEND_CONFIG_B64: ${{ secrets.YC_TF_BACKEND_CONFIG_B64 }}
      YC_TF_VARS_B64: ${{ secrets.YC_TF_VARS_B64 }}
      YC_MONIUM_API_KEY: ${{ secrets.YC_MONIUM_API_KEY }}
      YC_PUBLIC_BASE_URL: ${{ secrets.YC_PUBLIC_BASE_URL }}
      YC_SMOKE_HOST: ${{ secrets.YC_SMOKE_HOST }}
      YC_PORTAL_PUBLIC_BASE_URL: ${{ secrets.YC_PORTAL_PUBLIC_BASE_URL }}
      YC_PORTAL_OIDC_CLIENT_SECRET: ${{ secrets.YC_PORTAL_OIDC_CLIENT_SECRET }}
      YC_TERRAFORM_AUTO_APPLY: ${{ secrets.YC_TERRAFORM_AUTO_APPLY }}
    steps:
      - name: Validate required deploy secrets
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == 'pull_request' ]]; then
            echo "PR validation path skips production deploy secrets."
            exit 0
          fi

          missing=()
          for name in \
            YC_SERVICE_ACCOUNT_KEY_JSON \
            YC_CLOUD_ID \
            YC_FOLDER_ID \
            YC_CONTAINER_REGISTRY_ID \
            YC_TF_BACKEND_CONFIG_B64 \
            YC_TF_VARS_B64 \
            YC_MONIUM_API_KEY \
            YC_PUBLIC_BASE_URL \
            YC_SMOKE_HOST \
            YC_PORTAL_PUBLIC_BASE_URL \
            YC_PORTAL_OIDC_CLIENT_SECRET
          do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            {
              echo "Missing required GitHub Actions secrets for Yandex Cloud deploy:"
              printf ' - %s\n' "${missing[@]}"
            } >&2
            exit 1
          fi

          if [[ "${YC_TERRAFORM_AUTO_APPLY}" != 'true' ]]; then
            {
              echo "YC_TERRAFORM_AUTO_APPLY must be true for a production deploy."
              echo "Otherwise Terraform apply, frontend publish, YDB bootstrap, and smoke checks are skipped."
            } >&2
            exit 1
          fi

  build-push-backend:
    name: Build backend image
    runs-on: ubuntu-latest
    needs:
      - generate-build-id
      - validate-deploy-secrets
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build image (PR validation)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: services/id
          push: false
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: id-ci/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
      - name: Build and push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: services/id
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          outputs: type=image,oci-mediatypes=false
          tags: |
            cr.yandex/${{ secrets.YC_CONTAINER_REGISTRY_ID }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            cr.yandex/${{ secrets.YC_CONTAINER_REGISTRY_ID }}/${{ env.BACKEND_IMAGE }}:${{ needs.generate-build-id.outputs.build_id }}
            cr.yandex/${{ secrets.YC_CONTAINER_REGISTRY_ID }}/${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Prepare, verify and promote release
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: [build-push-backend, generate-build-id, validate-deploy-secrets]
    env:
      TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
      TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
      TF_VAR_existing_api_gateway_id: ${{ secrets.YC_EXISTING_API_GATEWAY_ID }}
      TF_VAR_monium_api_key: ${{ secrets.YC_MONIUM_API_KEY }}
      RELEASE_TAG: ${{ needs.generate-build-id.outputs.build_id }}
      YC_OBJECT_STORAGE_ENDPOINT: https://storage.yandexcloud.net
      AWS_DEFAULT_REGION: ru-central1
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install release tools
        run: |
          python -m pip install uv==0.8.5 PyYAML==6.0.3 awscli
          curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$RUNNER_TEMP/yc" -n
          echo "$RUNNER_TEMP/yc/bin" >> "$GITHUB_PATH"
      - name: Restore private deployment configuration
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
          YC_TF_VARS_B64: ${{ secrets.YC_TF_VARS_B64 }}
          YC_TF_BACKEND_CONFIG_B64: ${{ secrets.YC_TF_BACKEND_CONFIG_B64 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/id-release"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$RUNNER_TEMP/id-release/yc-sa-key.json"
          printf '%s' "$YC_TF_VARS_B64" | base64 --decode > infra/terraform/yandex-cloud/runtime.auto.tfvars
          printf '%s' "$YC_TF_BACKEND_CONFIG_B64" | base64 --decode > infra/terraform/yandex-cloud/backend.hcl
          echo "TF_VAR_service_account_key_file=$RUNNER_TEMP/id-release/yc-sa-key.json" >> "$GITHUB_ENV"
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('infra/terraform/yandex-cloud/image-tag.auto.tfvars.json').write_text(json.dumps({'container_image_tag': os.environ['RELEASE_TAG']}))
          PY
          yc config profile create deploy
          yc config set service-account-key "$RUNNER_TEMP/id-release/yc-sa-key.json"
          yc config set cloud-id "$TF_VAR_cloud_id"
          yc config set folder-id "$TF_VAR_folder_id"
      - name: Initialize and require existing production state
        run: |
          terraform -chdir=infra/terraform/yandex-cloud init -backend-config=backend.hcl
          terraform -chdir=infra/terraform/yandex-cloud state list > "$RUNNER_TEMP/id-release/state-list.txt"
          if [[ ! -s "$RUNNER_TEMP/id-release/state-list.txt" ]]; then
            echo 'Production state is empty; import the existing stack before deploying.' >&2
            exit 1
          fi
      - name: Snapshot the serving backend
        id: snapshot
        run: |
          python scripts/ci/snapshot-yc-runtime.py \
            --terraform-dir infra/terraform/yandex-cloud \
            --output infra/terraform/yandex-cloud/live.auto.tfvars.json \
            --blue-green --release-image-tag "$RELEASE_TAG" \
            --manifest "$RUNNER_TEMP/id-release/manifest.json"
      - name: Prepare inactive backend
        run: python scripts/ci/yc_rollout.py prepare --terraform-dir infra/terraform/yandex-cloud --manifest "$RUNNER_TEMP/id-release/manifest.json"
      - name: Resolve database and publication endpoints
        run: |
          public_base_url=$(terraform -chdir=infra/terraform/yandex-cloud output -raw public_base_url)
          ydb_endpoint=$(terraform -chdir=infra/terraform/yandex-cloud output -raw ydb_endpoint)
          ydb_database=$(terraform -chdir=infra/terraform/yandex-cloud output -raw ydb_database)
          echo "::add-mask::${ydb_endpoint}"
          echo "::add-mask::${ydb_database}"
          {
            echo "YDB_ENDPOINT=${ydb_endpoint}"
            echo "YDB_DATABASE=${ydb_database}"
            echo "YDB_SERVICE_ACCOUNT_KEY_FILE=$RUNNER_TEMP/id-release/yc-sa-key.json"
            echo "ID_ACTIVATION_BASE_URL=${public_base_url}"
            echo "ID_PUBLIC_BASE_URL=${public_base_url}/api/v1"
            echo "OIDC_ISSUER=${public_base_url}"
            echo "OIDC_PUBLIC_BASE_URL=${public_base_url}"
            echo "YC_BUCKET_NAME=$(terraform -chdir=infra/terraform/yandex-cloud output -raw frontend_bucket_name)"
          } >> "$GITHUB_ENV"
      - name: Migrate YDB and configure Portal client before promotion
        working-directory: services/id
        env:
          DJANGO_SETTINGS_MODULE: app.settings
          PYTHONPATH: src
          DJANGO_DEBUG: "false"
          DJANGO_ALLOWED_HOSTS: id.updspace.com,.yandexcloud.net,localhost,127.0.0.1
          DJANGO_SECRET_KEY: migrate-secret-min-32-characters-long
          ID_TOKEN_HASH_SECRET: migrate-token-hash-secret
          OIDC_REFRESH_TOKEN_SALT: migrate-refresh-salt
          BFF_INTERNAL_HMAC_SECRET: ${{ secrets.YC_BFF_INTERNAL_HMAC_SECRET }}
          PORTAL_OIDC_CLIENT_SECRET: ${{ secrets.YC_PORTAL_OIDC_CLIENT_SECRET }}
          PORTAL_PUBLIC_BASE_URL: ${{ secrets.YC_PORTAL_PUBLIC_BASE_URL }}
          DB_DRIVER: ydb
          YDB_NAME: default
          YDB_CREDENTIALS_MODE: sa_json
          YDB_SERVICE_ACCOUNT_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          uv sync --frozen --no-dev
          uv run --frozen python src/manage.py migrate_ydb
          uv run --frozen python src/manage.py setup_db --skip-migrate
          uv run --frozen python src/manage.py setup_portal_client \
            --client-id updspace-portal --secret "$PORTAL_OIDC_CLIENT_SECRET" \
            --site-domain id.updspace.com --portal-base-url "$PORTAL_PUBLIC_BASE_URL"
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v5
        with:
          version: 10.3.0
          run_install: false
      - name: Build frontend before switching traffic
        working-directory: web/id-frontend
        env:
          VITE_BUILD_ID: ${{ needs.generate-build-id.outputs.build_id }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Configure temporary Object Storage credentials
        run: |
          umask 077
          access_key_file="$RUNNER_TEMP/id-release/object-storage-access-key.json"
          yc iam access-key create --service-account-name updspace-id-automation \
            --description "Temporary frontend publish ${GITHUB_RUN_ID}" --format json > "$access_key_file"
          access_key_id=$(jq -r '.access_key.id' "$access_key_file")
          key_id=$(jq -r '.access_key.key_id' "$access_key_file")
          secret_key=$(jq -r '.secret' "$access_key_file")
          echo "::add-mask::${key_id}"
          echo "::add-mask::${secret_key}"
          {
            echo "AWS_ACCESS_KEY_ID=${key_id}"
            echo "AWS_SECRET_ACCESS_KEY=${secret_key}"
            echo "YC_TEMP_ACCESS_KEY_ID=${access_key_id}"
          } >> "$GITHUB_ENV"
      - name: Save current frontend entry document
        run: |
          umask 077
          aws --endpoint-url "$YC_OBJECT_STORAGE_ENDPOINT" s3 cp \
            "s3://${YC_BUCKET_NAME}/index.html" "$RUNNER_TEMP/id-release/previous-index.html" --only-show-errors
      - name: Verify candidate database and shared cache
        run: python scripts/ci/yc_rollout.py warm --terraform-dir infra/terraform/yandex-cloud --manifest "$RUNNER_TEMP/id-release/manifest.json"
      - name: Promote verified backend
        run: python scripts/ci/yc_rollout.py promote --terraform-dir infra/terraform/yandex-cloud --manifest "$RUNNER_TEMP/id-release/manifest.json"
      - name: Publish frontend dependencies and entry document
        id: publish
        working-directory: web/id-frontend
        run: |
          touch "$RUNNER_TEMP/id-release/publication-attempted"
          ../../scripts/ci/deploy-frontend-object-storage.sh
      - name: Verify public release
        id: smoke
        env:
          SMOKE_BASE_URL: ${{ secrets.YC_PUBLIC_BASE_URL }}
          SMOKE_HOST_HEADER: ${{ secrets.YC_SMOKE_HOST }}
        run: ./scripts/ci/smoke-yc-gateway.sh
      # Cleanup is deliberately after the commit point. Its failure must never
      # roll public traffic back to a slot whose prepared capacity is retiring.
      - name: Release previous backend prepared capacity
        id: retire
        if: steps.smoke.outcome == 'success'
        run: python scripts/ci/yc_rollout.py retire --terraform-dir infra/terraform/yandex-cloud --manifest "$RUNNER_TEMP/id-release/manifest.json"
      - name: Restore previous frontend after failed release
        if: failure() && steps.smoke.outcome != 'success'
        run: |
          if [[ -f "$RUNNER_TEMP/id-release/publication-attempted" && -f "$RUNNER_TEMP/id-release/previous-index.html" ]]; then
            aws --endpoint-url "$YC_OBJECT_STORAGE_ENDPOINT" s3 cp \
              "$RUNNER_TEMP/id-release/previous-index.html" "s3://${YC_BUCKET_NAME}/index.html" \
              --content-type 'text/html; charset=utf-8' --cache-control no-cache --only-show-errors
          fi
      - name: Restore previous backend after failed release
        if: failure() && steps.snapshot.outcome == 'success' && steps.smoke.outcome != 'success'
        run: python scripts/ci/yc_rollout.py rollback --terraform-dir infra/terraform/yandex-cloud --manifest "$RUNNER_TEMP/id-release/manifest.json"
      - name: Release failed candidate prepared capacity
        if: failure() && steps.snapshot.outcome == 'success' && steps.smoke.outcome != 'success'
        run: python scripts/ci/yc_rollout.py abort --terraform-dir infra/terraform/yandex-cloud --manifest "$RUNNER_TEMP/id-release/manifest.json"
      - name: Delete temporary Object Storage credentials
        if: always()
        run: |
          access_key_file="$RUNNER_TEMP/id-release/object-storage-access-key.json"
          if [[ -s "$access_key_file" ]]; then
            access_key_id=$(jq -r '.access_key.id // empty' "$access_key_file")
            if [[ -n "$access_key_id" ]]; then
              yc iam access-key delete "$access_key_id"
            fi
          fi
