name: Deploy Yandex Cloud Rust ID

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["ID CI/CD"]
    types: [completed]
    branches: [main, master]

concurrency:
  group: deploy-yc-rust
  cancel-in-progress: false

env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  RUST_API_CONTAINER_ID: bbak8734de8cabdaorc7
  RUST_SESSIONS_CONTAINER_ID: bba3ev9oenabp55se69m
  RUST_MUTATIONS_CONTAINER_ID: bbamj363kmhlj2nof0mo
  RUST_WEB_CONTAINER_ID: bbai4bjc8f21qg5fvjht
  RUST_JOBS_CONTAINER_ID: bba9v82d1op2qbh2kqtt
  ID_GATEWAY_ID: d5d6almt4c5i2ao9e4ha

jobs:
  verify-revision:
    name: Require tested source revision
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: Verify CI jobs for this SHA
        working-directory: services/id-rust
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
          cargo run --locked -p id-runtime --bin idctl -- verify-tested-revision

  build:
    name: Build and push Rust images
    needs: verify-revision
    runs-on: ubuntu-latest
    outputs:
      api_digest: ${{ steps.api.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}
      jobs_digest: ${{ steps.jobs.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
      - name: API image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: services/id-rust
          file: services/id-rust/Dockerfile.api
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          outputs: type=image,oci-mediatypes=false
          tags: cr.yandex/${{ secrets.YC_CONTAINER_REGISTRY_ID }}/updatingspace-id-api:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=rust-api
          cache-to: type=gha,scope=rust-api,mode=max
      - name: Topcoat image
        id: web
        uses: docker/build-push-action@v6
        with:
          context: services/id-rust
          file: services/id-rust/Dockerfile.web
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          outputs: type=image,oci-mediatypes=false
          tags: cr.yandex/${{ secrets.YC_CONTAINER_REGISTRY_ID }}/updatingspace-id-web:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=rust-web
          cache-to: type=gha,scope=rust-web,mode=max
      - name: Jobs image
        id: jobs
        uses: docker/build-push-action@v6
        with:
          context: services/id-rust
          file: services/id-rust/Dockerfile.jobs
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          outputs: type=image,oci-mediatypes=false
          tags: cr.yandex/${{ secrets.YC_CONTAINER_REGISTRY_ID }}/updatingspace-id-jobs:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=rust-jobs
          cache-to: type=gha,scope=rust-jobs,mode=max

  deploy:
    name: Deploy existing Rust containers
    needs: build
    runs-on: ubuntu-latest
    env:
      API_DIGEST: ${{ needs.build.outputs.api_digest }}
      WEB_DIGEST: ${{ needs.build.outputs.web_digest }}
      JOBS_DIGEST: ${{ needs.build.outputs.jobs_digest }}
      REGISTRY_ID: ${{ secrets.YC_CONTAINER_REGISTRY_ID }}
      YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
      YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
      YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"
      - name: Install YC CLI and configure identity
        run: |
          set -euo pipefail
          test -n "$YC_SERVICE_ACCOUNT_KEY_JSON"
          test -n "$YC_CLOUD_ID"
          test -n "$YC_FOLDER_ID"
          test -n "$REGISTRY_ID"
          for digest in "$API_DIGEST" "$WEB_DIGEST" "$JOBS_DIGEST"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          done
          curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$RUNNER_TEMP/yc" -n
          echo "$RUNNER_TEMP/yc/bin" >> "$GITHUB_PATH"
          install -m 600 /dev/null "$RUNNER_TEMP/yc-sa-key.json"
          printf '%s' "$YC_SERVICE_ACCOUNT_KEY_JSON" > "$RUNNER_TEMP/yc-sa-key.json"
          "$RUNNER_TEMP/yc/bin/yc" config profile create deploy
          "$RUNNER_TEMP/yc/bin/yc" config set service-account-key "$RUNNER_TEMP/yc-sa-key.json"
          "$RUNNER_TEMP/yc/bin/yc" config set cloud-id "$YC_CLOUD_ID"
          "$RUNNER_TEMP/yc/bin/yc" config set folder-id "$YC_FOLDER_ID"
      - name: Verify live Gateway and target containers
        run: |
          set -euo pipefail
          spec=$(yc serverless api-gateway get-spec --id "$ID_GATEWAY_ID" --format json | jq -r '.openapi_spec')
          [[ "$spec" == *"$RUST_API_CONTAINER_ID"* ]]
          [[ "$spec" == *"$RUST_SESSIONS_CONTAINER_ID"* ]]
          [[ "$spec" == *"$RUST_MUTATIONS_CONTAINER_ID"* ]]
          [[ "$spec" == *"$RUST_WEB_CONTAINER_ID"* ]]
          [[ "$spec" != *"bbab7jbbhqhupu9idvh0"* ]]
          printf '%s' "$spec" | node scripts/ci/check-yc-gateway-containers.mjs
          for id in "$RUST_API_CONTAINER_ID" "$RUST_SESSIONS_CONTAINER_ID" "$RUST_MUTATIONS_CONTAINER_ID" "$RUST_WEB_CONTAINER_ID" "$RUST_JOBS_CONTAINER_ID"; do
            yc serverless container get --id "$id" --format json >/dev/null
          done
      - name: Apply additive Rust YDB schemas
        working-directory: services/id-rust
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
          ydb_json=$(yc ydb database get --name updspace-id --format json)
          endpoint=$(jq -r '.endpoint | split("?")[0]' <<< "$ydb_json")
          database=$(jq -r '.endpoint | split("?database=")[1]' <<< "$ydb_json")
          test -n "$endpoint"
          test -n "$database"
          export YDB_ENDPOINT="$endpoint"
          export YDB_DATABASE="$database"
          export YDB_CREDENTIALS_MODE=token
          export YDB_TOKEN="$(yc iam create-token)"
          for schema in cache-schema password-mail-schema security-mail-schema password-reset-schema email-verify-schema magic-link-schema email-change-schema data-export-schema data-export-escrow-schema data-export-mail-schema passkey-index; do
            cargo run --locked --release -p id-runtime --bin idctl -- "$schema"
          done
      - name: Capture serving Rust revisions
        id: capture
        run: node scripts/ci/rollback-yc-rust-revisions.mjs capture "$RUNNER_TEMP/id-rust-revisions.json"
      - name: Deploy Rust API
        run: |
          set -euo pipefail
          revision=$(yc serverless container revision list --container-id "$RUST_API_CONTAINER_ID" --format json | jq -r '[.[] | select(.status == "ACTIVE")] | sort_by(.created_at) | last.id')
          node scripts/ci/deploy-yc-rust-revision.mjs "$RUST_API_CONTAINER_ID" "$revision" "cr.yandex/$REGISTRY_ID/updatingspace-id-api@$API_DIGEST" --set-env "BUILD_ID=$DEPLOY_SHA" --apply
          node scripts/ci/smoke-yc-rust-http.mjs api
      - name: Deploy Rust sessions API
        run: |
          set -euo pipefail
          revision=$(yc serverless container revision list --container-id "$RUST_SESSIONS_CONTAINER_ID" --format json | jq -r '[.[] | select(.status == "ACTIVE")] | sort_by(.created_at) | last.id')
          node scripts/ci/deploy-yc-rust-revision.mjs "$RUST_SESSIONS_CONTAINER_ID" "$revision" "cr.yandex/$REGISTRY_ID/updatingspace-id-api@$API_DIGEST" --set-env "BUILD_ID=$DEPLOY_SHA" --apply
          node scripts/ci/smoke-yc-rust-http.mjs sessions
      - name: Deploy Rust mutations API
        run: |
          set -euo pipefail
          revision=$(yc serverless container revision list --container-id "$RUST_MUTATIONS_CONTAINER_ID" --format json | jq -r '[.[] | select(.status == "ACTIVE")] | sort_by(.created_at) | last.id')
          node scripts/ci/deploy-yc-rust-revision.mjs "$RUST_MUTATIONS_CONTAINER_ID" "$revision" "cr.yandex/$REGISTRY_ID/updatingspace-id-api@$API_DIGEST" --set-env "BUILD_ID=$DEPLOY_SHA" --apply
          node scripts/ci/smoke-yc-rust-http.mjs mutations
      - name: Deploy Topcoat UI
        run: |
          set -euo pipefail
          revision=$(yc serverless container revision list --container-id "$RUST_WEB_CONTAINER_ID" --format json | jq -r '[.[] | select(.status == "ACTIVE")] | sort_by(.created_at) | last.id')
          node scripts/ci/deploy-yc-rust-revision.mjs "$RUST_WEB_CONTAINER_ID" "$revision" "cr.yandex/$REGISTRY_ID/updatingspace-id-web@$WEB_DIGEST" --set-env "BUILD_ID=$DEPLOY_SHA" --apply
          node scripts/ci/smoke-yc-rust-http.mjs web
      - name: Deploy Rust jobs
        run: |
          set -euo pipefail
          revision=$(yc serverless container revision list --container-id "$RUST_JOBS_CONTAINER_ID" --format json | jq -r '[.[] | select(.status == "ACTIVE")] | sort_by(.created_at) | last.id')
          node scripts/ci/deploy-yc-rust-revision.mjs "$RUST_JOBS_CONTAINER_ID" "$revision" "cr.yandex/$REGISTRY_ID/updatingspace-id-jobs@$JOBS_DIGEST" --set-env "BUILD_ID=$DEPLOY_SHA" --apply
          yc serverless container revision list --container-id "$RUST_JOBS_CONTAINER_ID" --format json | jq -e 'any(.[]; .status == "ACTIVE")'
      - name: Verify delayed export bundle when enabled
        run: |
          set -euo pipefail
          delayed=$(yc serverless container revision list --container-id "$RUST_MUTATIONS_CONTAINER_ID" --format json | jq -r '[.[] | select(.status == "ACTIVE")][0].image.environment.ID_EXPORT_DELAYED_ROLLOUT_ENABLED // "false"')
          if [[ "$delayed" == "true" ]]; then
            EXPECTED_BUILD_ID="$DEPLOY_SHA" node scripts/ci/check-yc-delayed-export.mjs
            node scripts/ci/smoke-yc-rust-http.mjs delayed-export
          fi
      - name: Restore previous Rust images after failed deployment
        if: failure() && steps.capture.outcome == 'success'
        run: node scripts/ci/rollback-yc-rust-revisions.mjs rollback "$RUNNER_TEMP/id-rust-revisions.json"
