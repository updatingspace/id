name: ID CI/CD

on:
  push:
    branches:
      - main
      - master
      - "codex/rust-coverage-gates"
  pull_request:
    branches:
      - main
      - master

env:
  NODE_VERSION: "22.12.0"

jobs:
  rust-dependency-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Restore pinned audit tool
        id: audit-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/id-audit-tools
          key: cargo-audit-0.22.2-${{ runner.os }}-${{ runner.arch }}-rust-1.98.1
      - name: Install pinned cargo-audit
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo +1.98.1 install cargo-audit --locked --version 0.22.2 --root "$RUNNER_TEMP/id-audit-tools"
      - name: Check locked dependencies against current RustSec advisories
        working-directory: services/id-rust
        run: '"$RUNNER_TEMP/id-audit-tools/bin/cargo-audit" audit'

  rust-stack:
    name: Rust API and Topcoat
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        working-directory: services/id-rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Reject retired application runtimes
        working-directory: .
        run: |
          test ! -e services/id
          test ! -e web/id-frontend
          if [ -n "$(git ls-files -- '*.py' '**/*.py' 'pyproject.toml' '**/pyproject.toml' 'uv.lock' '**/uv.lock')" ]; then
            echo 'Python application or tooling returned to the repository' >&2
            exit 1
          fi
          if git grep -n -E 'updatingspace-id-backend|gunicorn|app\.jobs:application' -- infra/terraform/yandex-cloud; then
            echo 'Retired Django deployment path returned to Terraform' >&2
            exit 1
          fi
          if git grep -n -E 'type: object_storage|object: index\.html|frontend_static_routes' -- infra/terraform/yandex-cloud/templates/api-gateway.openapi.yaml.tftpl infra/terraform/yandex-cloud/locals.tf; then
            echo 'Retired React Gateway fallback returned' >&2
            exit 1
          fi
          if git grep -n -E 'resource "yandex_storage_bucket" "frontend"|yandex_storage_bucket\.frontend' -- infra/terraform/yandex-cloud; then
            echo 'Retired React bucket returned to Terraform' >&2
            exit 1
          fi
      - name: Verify delayed-export deploy gate
        working-directory: .
        run: node scripts/ci/test-check-yc-delayed-export.mjs
      - name: Verify account-deletion deploy gate
        working-directory: .
        run: node scripts/ci/test-check-yc-account-deletion.mjs
      - name: Verify production CI event gate
        working-directory: .
        run: node scripts/ci/test-verify-yc-workflow-event.mjs
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Install WebAuthn build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config ripgrep
      - name: Format and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Unit tests and release binaries
        run: |
          cargo test --locked --workspace
          cargo build --locked --release -p id-runtime --bin id-api --bin idctl
          cargo build --locked --release -p id-runtime --bin id-jobs
          cargo build --locked --release -p id-web
      - name: Verify private export storage diagnostics
        run: ID_RUST_BIN_DIR="$PWD/target/release" node scripts/test-idctl-export-storage-smoke.cjs
      - name: Topcoat security SSR smoke
        run: ID_RUST_BIN_DIR="$PWD/target/release" bash scripts/smoke-web-security.sh
      - name: Topcoat operator account SSR smoke
        run: ID_RUST_BIN_DIR="$PWD/target/release" bash scripts/smoke-web-admin.sh
      - name: Topcoat recovery SSR smoke
        run: ID_RUST_BIN_DIR="$PWD/target/release" bash scripts/smoke-web-recovery.sh
      - name: Topcoat legacy form-token browser contract
        run: node scripts/test-web-recovery-legacy-csrf.cjs
      - name: Topcoat email-management browser contract
        run: node scripts/test-web-email-management.cjs
      - name: Topcoat signup SSR smoke
        run: ID_RUST_BIN_DIR="$PWD/target/release" bash scripts/smoke-web-signup.sh
      - name: Check deployment images
        run: |
          docker build --check -f Dockerfile.api .
          docker build --check -f Dockerfile.jobs .
          docker build --check -f Dockerfile.web .

  ydb-schema-check:
    name: Rust YDB schema and auth integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/id-rust
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "ci-secret-key-min-32-characters-long"
      ID_TOKEN_HASH_SECRET: "ci-token-hash-secret"
      OIDC_REFRESH_TOKEN_SALT: "ci-refresh-token-salt"
      YDB_ENDPOINT: grpc://localhost:2136
      YDB_DATABASE: /local
      YDB_CREDENTIALS_MODE: anonymous
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal

      - name: Install WebAuthn build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config ripgrep

      - name: Start YDB local
        run: |
          docker run -d --rm \
            --name ydb-local \
            --hostname 127.0.0.1 \
            -p 2136:2136 \
            -p 8765:8765 \
            ydbplatform/local-ydb@sha256:9e46fd45875551a75bcf34d0bb9ca0baa1d8763a4ccf2070af45f4467c4b7402
          ../../scripts/ci/wait-for-ydb-local.sh

      - name: Bootstrap legacy schema with Rust
        run: |
          cargo run --locked -p id-runtime --bin idctl -- legacy-schema --apply
          cargo run --locked -p id-runtime --bin idctl -- legacy-schema --apply
          cargo run --locked -p id-runtime --bin idctl -- cache-schema
          cargo run --locked -p id-runtime --bin idctl -- cache-schema

      - name: Verify Passkey registration with missing client extension output
        env:
          ID_AUTH_TOTP_PILOT_ENABLED: "true"
          ID_AUTH_PASSKEY_REGISTRATION_PILOT_ENABLED: "true"
          ID_MFA_SEAL_KEY_B64: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          ID_WEBAUTHN_RP_ID: id.example.invalid
          ID_WEBAUTHN_ORIGIN: https://id.example.invalid
        run: |
          cargo run --locked -p id-runtime --bin idctl -- passkey-index
          cargo test --locked -p id-runtime --test passkey_registration_ydb -- --ignored

      - name: Verify Rust OIDC form authorization on local YDB
        env:
          YDB_CREDENTIALS_MODE: anonymous
          ID_OIDC_AUTHORIZE_PILOT_ENABLED: "true"
          ID_OIDC_TOKEN_PILOT_ENABLED: "true"
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          cargo test --locked -p id-runtime --test oidc_authorize_ydb -- --ignored

      - name: Verify Rust profile and avatar deletion on local YDB
        env:
          YDB_CREDENTIALS_MODE: anonymous
          ID_AUTH_PROFILE_PILOT_ENABLED: "true"
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          cargo test --locked -p id-runtime --test profile_http_ydb -- --ignored

      - name: Verify Rust password change and durable mail on local YDB
        run: bash ../../scripts/ci/run-rust-security-scenarios.sh password-change

      - name: Verify Rust password recovery on local YDB
        run: bash ../../scripts/ci/run-rust-security-scenarios.sh password-reset

      - name: Verify Rust email confirmation and durable mail on local YDB
        run: bash ../../scripts/ci/run-rust-security-scenarios.sh email-verification

      - name: Verify Rust magic-link request, SMTP delivery and one-use exchange on local YDB
        env:
          YDB_CREDENTIALS_MODE: anonymous
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          cargo run --locked -p id-runtime --bin idctl -- magic-link-schema
          cargo run --locked -p id-runtime --bin idctl -- magic-link-schema
          cargo test --locked -p id-runtime --test magic_link_request_ydb -- --ignored
          cargo test --locked -p id-runtime --test magic_link_consume_ydb -- --ignored
          cargo test --locked -p id-runtime --lib magic_link_request::tests::mail_claim_has_one_owner_and_retry_after_lease -- --ignored

      - name: Verify Rust email change ownership and one-use confirmation on local YDB
        run: bash ../../scripts/ci/run-rust-security-scenarios.sh email-change

      - name: Verify delayed export escrow, cancellation and expired object cleanup
        run: bash ../../scripts/ci/run-rust-security-scenarios.sh export-escrow

      - name: Verify isolated cutover, delayed export and deletion finalization
        run: bash ../../scripts/ci/run-rust-security-scenarios.sh isolated-deletion

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Chromium for Topcoat E2E
        run: |
          cd browser-tests
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify Chromium to Topcoat to Rust recovery on local YDB
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          YDB_CREDENTIALS_MODE: anonymous
        run: |
          cargo build --locked -p id-runtime --bins -p id-web
          bash ../../scripts/ci/run-rust-security-scenarios.sh recovery-browser

      - name: Verify Chromium to Topcoat to Rust deletion on disposable YDB
        run: ID_RUST_BIN_DIR="$PWD/target/debug" bash ../../scripts/ci/run-rust-security-scenarios.sh deletion-browser

      - name: Verify public export link fragment, download and expiry in Chromium
        run: node scripts/check-web-export-redeem-browser.cjs

      - name: Verify inline passkey management in Chromium
        run: node scripts/check-web-passkey-management-browser.cjs

      - name: Verify TOTP status and recovery-code completion in Chromium
        run: node scripts/check-web-totp-state-browser.cjs

      - name: Verify login MFA state and account return path in Chromium
        run: node scripts/check-web-login-state-browser.cjs

      - name: Verify GitHub/Discord login capability and pending MFA in Chromium
        run: node scripts/check-web-provider-login-browser.cjs

      - name: Verify responsive account UI, themes and form state in Chromium
        run: node scripts/check-web-ui-browser.cjs

      - name: Verify gated account deletion review in Chromium
        run: bash ../../scripts/ci/run-rust-security-scenarios.sh deletion-review-browser

      - name: Verify operator suspension and OIDC client lookup in Chromium
        run: bash ../../scripts/ci/run-rust-security-scenarios.sh admin-browser

      - name: Verify real operator journey through Topcoat and Rust on local YDB
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          YDB_CREDENTIALS_MODE: anonymous
        run: bash ../../scripts/ci/run-rust-security-scenarios.sh admin-live

      - name: Verify Chromium to Topcoat to Rust signup on local YDB
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          YDB_CREDENTIALS_MODE: anonymous
        run: bash ../../scripts/ci/run-rust-security-scenarios.sh signup-browser

      - name: Verify native WebAuthn registration through Topcoat and Rust on local YDB
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          YDB_CREDENTIALS_MODE: anonymous
        run: bash scripts/smoke-web-passkey-native-live.sh

  terraform-check:
    name: Terraform validate
    runs-on: ubuntu-latest
    env:
      TF_VAR_cloud_id: dummy-cloud
      TF_VAR_folder_id: dummy-folder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify exact Rust revision rollback
        run: node scripts/ci/test-yc-rust-rollback.mjs

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Terraform fmt
        run: terraform fmt -check -recursive infra/terraform/yandex-cloud

      - name: Terraform init
        run: terraform -chdir=infra/terraform/yandex-cloud init -backend=false

      - name: Terraform validate
        run: terraform -chdir=infra/terraform/yandex-cloud validate

  opentofu-check:
    name: OpenTofu validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2

      - name: OpenTofu local check
        run: scripts/ci/check-yc-terraform-local.sh

  rust-extended:
    uses: ./.github/workflows/rust-pilot.yml

  rust-coverage-baseline:
    # Preparatory branch measurement; keep the required stable run above.
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/rust-coverage-gates'
    uses: ./.github/workflows/rust-pilot.yml
    with:
      coverage: true
