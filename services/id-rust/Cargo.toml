[workspace]
members = ["crates/id-compat", "crates/id-runtime", "crates/id-web"]
exclude = ["vendor/ydb"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
version = "0.1.0"
publish = false

[workspace.dependencies]
anyhow = "1.0"
aes-gcm = "=0.10.3"
argon2 = "0.5"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
bcrypt = "0.17"
clap = { version = "4.5", features = ["derive", "env"] }
cookie = "=0.18.2"
chrono = "0.4"
flate2 = "1.1"
hex = "0.4"
hmac = "0.12"
jsonwebtoken = "=9.3.1"
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
http = "1.3"
pbkdf2 = "0.12"
pem = "=3.0.6"
rand = "=0.9.5"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "http2", "charset"] }
quick-xml = { version = "=0.42.0", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
simple_asn1 = "=0.6.4"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "net", "time", "io-util"] }
topcoat = { version = "=0.9.0", default-features = false, features = ["router", "serve", "view"] }
askama = "=0.16.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower = { version = "=0.5.3", features = ["util"] }
ydb = "=0.18.2"
ydb-grpc = "=0.2.2"
uuid = "=1.27.0"
url = "2.5"
webauthn-rs = { version = "=0.5.5", default-features = false, features = ["danger-allow-state-serialisation", "conditional-ui"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
# Published YDB 0.18.2 still selects vulnerable reqwest 0.11; only its HTTP
# dependency is changed in this reviewed, licensed copy. See vendor/README.md.
ydb = { path = "vendor/ydb" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
