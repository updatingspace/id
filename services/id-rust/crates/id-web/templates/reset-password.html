<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/_id/ui.css?v=ui-20261008-1" />
  <title>Новый пароль — UpdSpace ID</title>
  <link rel="stylesheet" href="/_id/login.css?v=ui-20261008-1">
  <script src="/_id/recovery.js?v=ui-20261008-1" defer></script>
  <script src="/_id/ui.js?v=ui-20261008-1"></script>
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="reset-title">
      <a class="brand" href="/">UpdSpace ID</a>
      <h1 id="reset-title">Создать новый пароль</h1>
      <p class="intro">Новый пароль заменит прежний. После сохранения войдите с ним снова; прежние сеансы будут закрыты.</p>
      <p id="status" role="status" aria-live="polite" hidden></p>
      <p id="error" role="alert" aria-live="assertive" hidden></p>
      <form id="reset-form" method="post" action="/reset-password" hidden>
        <label for="password">Новый пароль</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="4096" required>
        <label for="confirmation">Повторите пароль</label>
        <input id="confirmation" name="confirmation" type="password" autocomplete="new-password" minlength="10" maxlength="4096" required>
        <button id="submit" type="submit">Сохранить пароль</button>
      </form>
      <noscript>Для проверки ссылки и смены пароля нужен JavaScript.</noscript>
      <p class="help"><a href="/forgot-password">Запросить новую ссылку</a></p>
      <p class="help"><a href="/login">Вернуться ко входу</a></p>
    <label class="theme-control">Оформление<select data-theme-select aria-label="Оформление"><option value="system">Как на устройстве</option><option value="light">Светлое</option><option value="dark">Тёмное</option></select></label>
    </section>
  </main>
</body>
</html>
