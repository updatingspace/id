<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/_id/ui.css?v=ui-20261008-2" />
  <title>Восстановление доступа — UpdSpace ID</title>
  <link rel="stylesheet" href="/_id/login.css?v=ui-20261008-1">
  <script src="/_id/recovery.js?v=ui-20261008-1" defer></script>
  <script src="/_id/ui.js?v=ui-20261008-1"></script>
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="recovery-title">
      <a class="brand" href="/">UpdSpace ID</a>
      <h1 id="recovery-title">Восстановить доступ</h1>
      <p class="intro">Укажите адрес почты аккаунта. Если он существует, мы отправим ссылку для смены пароля. Ответ на этой странице не покажет, зарегистрирован ли адрес.</p>
      <p id="status" role="status" aria-live="polite" hidden></p>
      <p id="error" role="alert" aria-live="assertive" hidden></p>
      <form id="forgot-form" method="post" action="/forgot-password">
        <label for="email">Электронная почта</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
        <button id="submit" type="submit">Отправить ссылку</button>
      </form>
      <noscript>Для отправки запроса нужен JavaScript.</noscript>
      <p class="help"><a href="/login">Вернуться ко входу</a></p>
    <label class="theme-control">Оформление<select data-theme-select aria-label="Оформление"><option value="system">Как на устройстве</option><option value="light">Светлое</option><option value="dark">Тёмное</option></select></label>
    </section>
  </main>
</body>
</html>
