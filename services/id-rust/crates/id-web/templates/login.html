<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Вход — UpdSpace ID</title>
  <link rel="stylesheet" href="/_id/login.css?v=ux-20261006-2" />
  <script src="/_id/login.js?v=ux-20261007-1" defer></script>
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="login-title">
      <a class="brand" href="/">UpdSpace ID</a>
      <h1 id="login-title">{{LOGIN_TITLE}}</h1>
      <p class="intro">{{LOGIN_INTRO}}</p>
      <p id="auth-context" role="status" {{AUTH_CONTEXT_HIDDEN}}>{{AUTH_CONTEXT}}</p>
      <p id="status" role="status" aria-live="polite" hidden></p>
      <p id="error" role="alert" aria-live="assertive" hidden></p>
      <form id="login-form" method="post" action="/login">
        <label for="email">Электронная почта</label>
        <input id="email" name="email" type="email" autocomplete="username" required />
        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <fieldset id="mfa-fields" hidden>
          <legend>Подтверждение входа</legend>
          <p>Этот шаг нужен, только если вы включили дополнительную защиту аккаунта. Он не заменяет выбор разрешений для приложения.</p>
          <label for="mfa-method">Способ подтверждения</label>
          <select id="mfa-method" name="mfa-method">
            <option value="totp">Код приложения</option>
            <option value="recovery">Резервный код</option>
          </select>
          <label for="mfa-code">Код</label>
          <input id="mfa-code" name="mfa-code" type="text" inputmode="numeric" autocomplete="one-time-code" />
        </fieldset>
        <button id="submit" type="submit">{{LOGIN_ACTION}}</button>
      </form>
      {{PASSKEY_ACTION}}
      {{RECOVERY_LINK}}
      {{SIGNUP_LINK}}
    </section>
  </main>
</body>
</html>
